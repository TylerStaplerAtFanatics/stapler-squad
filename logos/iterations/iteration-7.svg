<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512">

  <rect width="1024" height="512" fill="#0A0A0F"/>

  <g id="icon">

    <!-- Outer gold rim -->
    <circle cx="180" cy="256" r="150" fill="#C9A84C"/>
    <circle cx="180" cy="256" r="140" fill="#0A0A0F"/>

    <!-- Purple whisper ring -->
    <circle cx="180" cy="256" r="136" fill="none" stroke="#5B3678" stroke-width="4"/>

    <!-- Seal face -->
    <circle cx="180" cy="256" r="132" fill="#100D14"/>

    <!-- Inner gold framing ring -->
    <circle cx="180" cy="256" r="120" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.85"/>

    <!-- 8 position dots at 45° intervals -->
    <circle cx="316" cy="256" r="4.5" fill="#C9A84C"/>
    <circle cx="276" cy="352" r="4.5" fill="#C9A84C"/>
    <circle cx="180" cy="392" r="4.5" fill="#C9A84C"/>
    <circle cx="84"  cy="352" r="4.5" fill="#C9A84C"/>
    <circle cx="44"  cy="256" r="4.5" fill="#C9A84C"/>
    <circle cx="84"  cy="160" r="4.5" fill="#C9A84C"/>
    <circle cx="180" cy="120" r="4.5" fill="#C9A84C"/>
    <circle cx="276" cy="160" r="4.5" fill="#C9A84C"/>

    <!-- Staple signet — compound path, evenodd, no corner joints -->
    <path
      fill-rule="evenodd"
      fill="#8B1A3B"
      stroke="none"
      d="
        M 110,153
        L 250,153
        L 250,237
        L 263,237
        L 263,244
        L 228,244
        L 228,175
        L 132,175
        L 132,244
        L 97,244
        L 97,237
        L 110,237
        Z
      "/>

    <!-- Gold pressed-relief outline — outer silhouette -->
    <polyline points="110,237 110,153 250,153 250,237 263,237 263,244 228,244 228,237"
      fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linejoin="round"/>
    <polyline points="132,237 97,237 97,244 132,244"
      fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Inner arch faces — engraved quality -->
    <line x1="228" y1="175" x2="228" y2="237" stroke="#C9A84C" stroke-width="1.5"/>
    <line x1="132" y1="175" x2="132" y2="237" stroke="#C9A84C" stroke-width="1.5"/>
    <line x1="132" y1="175" x2="228" y2="175" stroke="#C9A84C" stroke-width="1.5"/>

    <!-- Small focal dot centered in arch opening -->
    <circle cx="180" cy="208" r="3" fill="#C9A84C" fill-opacity="0.6"/>

    <!-- Base rule — full terminal span -->
    <line x1="97" y1="264" x2="263" y2="264"
      stroke="#C9A84C" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Motto: · COMMITTE MIHI · in Cinzel -->
    <text x="87.1" y="318.6" transform="rotate(56.0,87.1,318.6)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">·</text>
    <text x="105.1" y="339.2" transform="rotate(42.0,105.1,339.2)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">C</text>
    <text x="115.8" y="347.7" transform="rotate(35.0,115.8,347.7)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">O</text>
    <text x="127.4" y="354.9" transform="rotate(28.0,127.4,354.9)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">M</text>
    <text x="139.9" y="360.6" transform="rotate(21.0,139.9,360.6)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">M</text>
    <text x="152.9" y="364.7" transform="rotate(14.0,152.9,364.7)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">I</text>
    <text x="166.4" y="367.2" transform="rotate(7.0,166.4,367.2)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">T</text>
    <text x="180.0" y="368.0" transform="rotate(0.0,180.0,368.0)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">T</text>
    <text x="193.6" y="367.2" transform="rotate(-7.0,193.6,367.2)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">E</text>
    <text x="220.1" y="360.6" transform="rotate(-21.0,220.1,360.6)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">M</text>
    <text x="232.6" y="354.9" transform="rotate(-28.0,232.6,354.9)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">I</text>
    <text x="244.2" y="347.7" transform="rotate(-35.0,244.2,347.7)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">H</text>
    <text x="254.9" y="339.2" transform="rotate(-42.0,254.9,339.2)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">I</text>
    <text x="272.9" y="318.6" transform="rotate(-56.0,272.9,318.6)" font-family="Cinzel, Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle">·</text>

  </g>

  <!-- Separator — faint gold rule -->
  <line x1="340" y1="110" x2="340" y2="402" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.2"/>

  <g id="wordmark">

    <!-- Wordmark shifted down 10px for proper vertical centering -->
    <text
      x="692"
      y="252"
      font-family="Cinzel, 'Cinzel SemiBold', Georgia, serif"
      font-size="72"
      font-weight="600"
      fill="#EDE0D0"
      letter-spacing="10"
      text-anchor="middle">SENESCHAL</text>

    <!-- Tagline now in Cinzel Regular — type family consistency -->
    <text
      x="692"
      y="294"
      font-family="Cinzel, Georgia, serif"
      font-size="13"
      font-weight="400"
      fill="#C9A84C"
      letter-spacing="5"
      text-anchor="middle">YOUR AGENTIC ESTATE, MANAGED</text>

  </g>

</svg>
