<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512">

  <rect width="1024" height="512" fill="#0A0A0F"/>

  <g id="icon">

    <!-- Outer gold rim — thicker (150→140 = 10px) -->
    <circle cx="180" cy="256" r="150" fill="#C9A84C"/>
    <circle cx="180" cy="256" r="140" fill="#0A0A0F"/>

    <!-- Purple whisper ring — more visible (stroke-width 3) -->
    <circle cx="180" cy="256" r="136" fill="none" stroke="#5B3678" stroke-width="3"/>

    <!-- Seal face -->
    <circle cx="180" cy="256" r="132" fill="#100D14"/>

    <!-- Inner gold framing ring — separates motto zone from central mark -->
    <circle cx="180" cy="256" r="120" fill="none" stroke="#C9A84C" stroke-width="1.5"/>

    <!-- 8 position dots at 45° intervals on the purple ring (r=136) -->
    <circle cx="316" cy="256" r="4.5" fill="#C9A84C"/>
    <circle cx="276" cy="352" r="4.5" fill="#C9A84C"/>
    <circle cx="180" cy="392" r="4.5" fill="#C9A84C"/>
    <circle cx="84"  cy="352" r="4.5" fill="#C9A84C"/>
    <circle cx="44"  cy="256" r="4.5" fill="#C9A84C"/>
    <circle cx="84"  cy="160" r="4.5" fill="#C9A84C"/>
    <circle cx="180" cy="120" r="4.5" fill="#C9A84C"/>
    <circle cx="276" cy="160" r="4.5" fill="#C9A84C"/>

    <!-- Staple signet — repositioned into upper face, clear of motto zone -->
    <!-- Centered vertically at y≈198, between seal top (y=124) and framing ring -->
    <!-- Top bar -->
    <rect x="112" y="155" width="136" height="20" fill="#8B1A3B" rx="5"/>
    <!-- Left leg -->
    <rect x="112" y="155" width="20" height="88" fill="#8B1A3B" rx="5"/>
    <!-- Right leg -->
    <rect x="228" y="155" width="20" height="88" fill="#8B1A3B" rx="5"/>

    <!-- Motto: · COMMITTE MIHI · curved along bottom inner arc (r=112) -->
    <!-- 14px, 7° step, reading left-to-right along lower arc -->
    <text x="87.1" y="318.6" transform="rotate(56.0,87.1,318.6)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">·</text>
    <text x="105.1" y="339.2" transform="rotate(42.0,105.1,339.2)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">C</text>
    <text x="115.8" y="347.7" transform="rotate(35.0,115.8,347.7)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">O</text>
    <text x="127.4" y="354.9" transform="rotate(28.0,127.4,354.9)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">M</text>
    <text x="139.9" y="360.6" transform="rotate(21.0,139.9,360.6)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">M</text>
    <text x="152.9" y="364.7" transform="rotate(14.0,152.9,364.7)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">I</text>
    <text x="166.4" y="367.2" transform="rotate(7.0,166.4,367.2)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">T</text>
    <text x="180.0" y="368.0" transform="rotate(0.0,180.0,368.0)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">T</text>
    <text x="193.6" y="367.2" transform="rotate(-7.0,193.6,367.2)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">E</text>
    <text x="220.1" y="360.6" transform="rotate(-21.0,220.1,360.6)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">M</text>
    <text x="232.6" y="354.9" transform="rotate(-28.0,232.6,354.9)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">I</text>
    <text x="244.2" y="347.7" transform="rotate(-35.0,244.2,347.7)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">H</text>
    <text x="254.9" y="339.2" transform="rotate(-42.0,254.9,339.2)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">I</text>
    <text x="272.9" y="318.6" transform="rotate(-56.0,272.9,318.6)" font-family="Georgia, serif" font-size="14" fill="#C9A84C" text-anchor="middle">·</text>

  </g>

  <!-- Separator — slightly visible -->
  <line x1="340" y1="90" x2="340" y2="422" stroke="#2A1E2C" stroke-width="1"/>

  <g id="wordmark">

    <text
      x="692"
      y="238"
      font-family="Cinzel, 'Cinzel SemiBold', Georgia, serif"
      font-size="72"
      font-weight="600"
      fill="#EDE0D0"
      letter-spacing="10"
      text-anchor="middle">SENESCHAL</text>

    <text
      x="692"
      y="292"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="14"
      font-weight="400"
      fill="#C9A84C"
      letter-spacing="5"
      text-anchor="middle">YOUR AGENTIC ESTATE, MANAGED</text>

  </g>

</svg>
